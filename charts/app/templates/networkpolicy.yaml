{{- if .Values.networkPolicy.enabled }}
# Разрешено только необходимое: вход от ingress-контроллера и Prometheus на порт приложения,
# выход — только DNS. Всё прочее закрыто default-deny политикой namespace (charts/platform).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slot.name" . }}
  labels:
    {{- include "slot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "slot.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheus.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.prometheus.podLabels | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
