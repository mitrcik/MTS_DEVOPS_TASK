{{- range $ns := list .Values.appNamespace .Values.monitoringNamespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: mts-devops
    pod-security.kubernetes.io/enforce: {{ $.Values.podSecurityLevel }}
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: {{ $.Values.podSecurityLevel }}
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
---
# Всё, что явно не разрешено политиками слотов (charts/app), запрещено.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Values.appNamespace }}
  labels:
    app.kubernetes.io/part-of: mts-devops
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
