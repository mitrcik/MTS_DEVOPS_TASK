# Учётная запись релизов: права только в namespace приложения. Нет доступа к узлам,
# другим namespace, ClusterRole, pods/exec. Используется bgctl через выделенный
# kubeconfig с ограниченным по сроку токеном (TokenRequest).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-controller
  namespace: {{ .Values.appNamespace }}
  labels:
    app.kubernetes.io/part-of: mts-devops
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-controller
  namespace: {{ .Values.appNamespace }}
  labels:
    app.kubernetes.io/part-of: mts-devops
rules:
  # объекты слотов, маршрутизации, состояния релизов и хранилище релизов Helm (Secret)
  - apiGroups: [""]
    resources: [services, configmaps, secrets, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # общая блокировка стенда
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  # диагностика и preview-проверки кандидата (port-forward), синхронизация Secret (patch)
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-controller
  namespace: {{ .Values.appNamespace }}
  labels:
    app.kubernetes.io/part-of: mts-devops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-controller
subjects:
  - kind: ServiceAccount
    name: release-controller
    namespace: {{ .Values.appNamespace }}
