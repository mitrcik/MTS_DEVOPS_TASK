# Начальная версия проходит тот же конвейер, что и любой релиз: lint → тесты → проверки
# конфигурации → сборка → Trivy → публикация в локальный registry → blue-green релиз.
# --if-absent: если на стенде уже есть здоровый активный релиз (любой версии), make up его не
# трогает — повторный запуск не перевыпускает и не откатывает рабочую версию.
- name: Конвейер и релиз начальной версии
  ansible.builtin.command:
    cmd: "{{ project_dir }}/scripts/release.sh --version {{ initial_version }} --if-absent"
  register: initial_release
  changed_when: "'уже есть здоровый активный релиз' not in initial_release.stderr"
  timeout: 1800

- name: Smoke-проверка стенда (API через ingress, токен, Prometheus targets, алерты, Grafana)
  ansible.builtin.command:
    cmd: "{{ bgctl }} verify"
  register: smoke
  changed_when: false
  timeout: 300
