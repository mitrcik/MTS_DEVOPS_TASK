# age-ключ и SOPS-источник создаются только при отсутствии. Существующие никогда не
# перезаписываются: ротация — отдельная явная команда (make rotate-secret).
- name: age-ключ и зашифрованный источник секретов
  ansible.builtin.command:
    cmd: "{{ bgctl }} secrets-init"
  register: secrets_init
  changed_when: "'created' in secrets_init.stderr or 'создан ' in secrets_init.stderr"
