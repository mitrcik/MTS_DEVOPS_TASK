{{- $ctx := dict "name" "prometheus" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    {{- include "obs.labels" $ctx | nindent 4 }}
---
# Обнаружение целей и cAdvisor: только чтение. nodes/metrics (а не nodes/proxy) —
# доступ к метрикам kubelet без возможности проксировать произвольные запросы к узлу.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mts-prometheus
  labels:
    {{- include "obs.labels" $ctx | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mts-prometheus
  labels:
    {{- include "obs.labels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mts-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
---
# Обнаружение pod — только в тех namespace, которые скрейпятся.
{{- range $ns := list .Values.appNamespace "kube-system" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mts-prometheus-discovery
  namespace: {{ $ns }}
  labels:
    {{- include "obs.labels" $ctx | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mts-prometheus-discovery
  namespace: {{ $ns }}
  labels:
    {{- include "obs.labels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mts-prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ $.Release.Namespace }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    {{- include "obs.labels" $ctx | nindent 4 }}
data:
  prometheus.yml: |
    {{- tpl (.Files.Get "files/prometheus.yml.tpl") . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  labels:
    {{- include "obs.labels" $ctx | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "files/rules/*.yml" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  labels:
    {{- include "obs.labels" $ctx | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.prometheus.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    {{- include "obs.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        {{- include "obs.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ tpl (.Files.Get "files/prometheus.yml.tpl") . | sha256sum }}
        checksum/rules: {{ (.Files.Glob "files/rules/*.yml").AsConfig | sha256sum }}
    spec:
      serviceAccountName: prometheus
      securityContext:
        {{- include "obs.podSecurity" . | nindent 8 }}
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      initContainers:
        # Ранняя понятная ошибка, если том недоступен на запись (local-path создаёт каталог с правами 0777).
        - name: storage-permissions
          image: {{ .Values.images.prometheus }}
          command: ["sh", "-c", "test -w /prometheus || (echo 'volume not writable' && exit 1)"]
          securityContext:
            {{- include "obs.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: {{ .Values.images.prometheus }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retentionTime }}
            - --storage.tsdb.retention.size={{ .Values.prometheus.retentionSize }}
            - --web.external-url=http://{{ .Values.hosts.prometheus }}:{{ .Values.ingressPort }}/
            - --web.route-prefix=/
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 15
            failureThreshold: 6
          securityContext:
            {{- include "obs.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "obs.labels" $ctx | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
{{ include "obs.ingress" (dict "name" "prometheus" "host" .Values.hosts.prometheus "port" 9090) }}
