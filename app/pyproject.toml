[project]
name = "mts-api"
version = "0.1.0"
description = "Demo REST API for the MTS DevOps delivery pipeline case"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях допустима

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
